<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Talker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0B1121;
      color: #E2E8F0;
      overflow: hidden;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font: inherit; }

    .app {
      display: flex; flex-direction: column; height: 100%;
      max-width: 960px; margin: 0 auto; padding: 8px 20px 0;
    }

    /* ===== Header ===== */
    .header {
      display: flex; justify-content: space-between; align-items: center; padding-bottom: 2px; flex-shrink: 0;
    }
    .header-title {
      font-size: 20px; font-weight: 600; letter-spacing: -0.3px;
      background: linear-gradient(135deg, #818CF8, #A78BFA);
      -webkit-text-fill-color: transparent; -webkit-background-clip: text;
    }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      background: #1E293B; transition: background 0.2s; font-size: 16px;
    }
    .icon-btn:hover { background: #334155; }
    .header-actions { display: flex; gap: 6px; }
    .model-badge {
      font-size: 11px; color: #555F72; background: #1E293B;
      padding: 2px 8px; border-radius: 6px; margin-left: auto; margin-right: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
      flex-shrink: 1; min-width: 0;
    }

    /* ===== Avatar Section (top area, compact) ===== */
    .avatar-section {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: center;
      gap: 5px; padding: 2px 0 0;
    }

    .avatar-container { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
    .avatar-ring {
      position: absolute; inset: 0; border-radius: 50%;
      transition: all 0.5s ease;
    }
    .avatar-ring.idle       { box-shadow: 0 0 36px rgba(129,140,248,0.13); animation: ringPulse 4s ease-in-out infinite; }
    .avatar-ring.preparing  { box-shadow: 0 0 44px rgba(99,102,241,0.20); animation: ringPulse 2s ease-in-out infinite; }
    .avatar-ring.listening  { box-shadow: 0 0 54px rgba(52,211,153,0.28);  animation: ringPulseFast 1.2s ease-in-out infinite; }
    .avatar-ring.processing { box-shadow: 0 0 48px rgba(251,191,36,0.22);  animation: ringSpin 2s linear infinite; }
    .avatar-ring.speaking   { box-shadow: 0 0 54px rgba(129,140,248,0.30); animation: ringPulse 0.8s ease-in-out infinite; }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes ringPulseFast {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.14); opacity: 0.9; }
    }
    @keyframes ringSpin {
      0% { transform: rotate(0deg); opacity: 0.6; }
      50% { transform: rotate(180deg); opacity: 1; }
      100% { transform: rotate(360deg); opacity: 0.6; }
    }

    .avatar-circle {
      position: relative; width: 115px; height: 115px; border-radius: 50%;
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      border: 2px solid rgba(129,140,248,0.18);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; z-index: 1;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .avatar-circle.idle       { animation: float 3s ease-in-out infinite; }
    .avatar-circle.listening  { animation: float 1.5s ease-in-out infinite; }
    .avatar-circle.processing { }
    .avatar-circle.speaking   { animation: float 0.8s ease-in-out infinite; }

    .avatar-face { width: 80px; height: 80px; }
    .avatar-face .eye-closed { opacity: 0; }

    .processing .avatar-face .eye-open { opacity: 0; }
    .processing .avatar-face .eye-closed { opacity: 1; }

    /* ===== Status ===== */
    .status-text {
      font-size: 18px; font-weight: 500; color: #94A3B8;
      text-align: center; min-height: 26px; transition: color 0.3s;
    }
    .status-text.preparing  { color: #818CF8; }
    .status-text.listening  { color: #34D399; }
    .status-text.processing { color: #FBBF24; }
    .status-text.speaking   { color: #818CF8; }

    /* Responding indicator — extra bump during processing */
    .respond-indicator {
      display: none; align-items: center; gap: 6px;
      font-size: 16px; color: #FBBF24; font-weight: 500;
      animation: fadeInUp 0.3s ease-out;
    }
    .respond-indicator.show { display: flex; }
    .respond-indicator .pencil {
      display: inline-block; animation: pencilWave 0.8s ease-in-out infinite alternate;
      font-size: 18px;
    }
    @keyframes pencilWave {
      0% { transform: rotate(-15deg); }
      100% { transform: rotate(15deg); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Preparing indicator */
    .preparing-indicator {
      display: none; align-items: center; gap: 8px;
      font-size: 16px; color: #818CF8; font-weight: 500;
      animation: fadeInUp 0.3s ease-out;
    }
    .preparing-indicator.show { display: flex; }
    .preparing-indicator .loader {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(129,140,248,0.2);
      border-top-color: #818CF8;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== Preview ===== */
    .preview-box {
      padding: 9px 16px; border-radius: 10px; min-height: 0; height: 0;
      font-size: 17px; color: #CBD5E1; text-align: center;
      width: 100%; overflow: hidden; transition: all 0.25s ease;
      border: 1px solid transparent; opacity: 0;
    }
    .preview-box.active {
      height: auto; min-height: 40px; opacity: 1;
      border-color: rgba(52,211,153,0.25);
      background: rgba(52,211,153,0.06);
    }

    /* ===== Action button ===== */
    .action-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 16px 48px; border-radius: 40px;
      font-size: 20px; font-weight: 600;
      transition: all 0.25s ease; margin-top: 4px;
    }
    .action-btn.idle {
      background: linear-gradient(135deg, #059669, #10B981);
      color: #F0FDF4; box-shadow: 0 0 28px rgba(16,185,129,0.3);
    }
    .action-btn.idle:hover { transform: scale(1.05); box-shadow: 0 0 38px rgba(16,185,129,0.4); }
    .action-btn.active {
      background: linear-gradient(135deg, #DC2626, #EF4444);
      color: #FEF2F2; box-shadow: 0 0 28px rgba(239,68,68,0.3);
    }
    .action-btn.active:hover { transform: scale(1.05); box-shadow: 0 0 38px rgba(239,68,68,0.4); }
    .action-btn:active { transform: scale(0.94) !important; }

    /* ===== Divider ===== */
    .divider {
      flex-shrink: 0; height: 1px; border: none; margin: 18px 0 10px;
      background: linear-gradient(90deg, transparent, #334155 20%, #334155 80%, transparent);
    }

    /* ===== Transcript ===== */
    .transcript {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 4px 0 4px; scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }
    .transcript::-webkit-scrollbar { width: 4px; }
    .transcript::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .transcript:empty { display: none; }

    .msg {
      display: flex; gap: 8px; margin-bottom: 10px;
      animation: msgIn 0.3s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }
    .msg .av {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .msg.user .av      { background: #4F46E5; }
    .msg.assist .av    { background: #1E293B; border: 1px solid #334155; }
    .msg .bub {
      max-width: 70%; padding: 10px 14px; border-radius: 14px;
      font-size: 17px; line-height: 1.55; word-break: break-word;
    }
    .msg.user .bub   { background: #4F46E5; color: #F8FAFC; border-bottom-right-radius: 4px; }
    .msg.assist .bub { background: #1E293B; border: 1px solid #334155; color: #E2E8F0; border-bottom-left-radius: 4px; }
    .msg.assist .bub.stream { border-color: #818CF8; }

    .typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing-dots span {
      width: 9px; height: 9px; border-radius: 50%; background: #818CF8;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* ===== Bottom ===== */
    .bottom-bar {
      flex-shrink: 0; padding: 4px 0 12px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    /* ===== Save area (below transcript) ===== */
    .save-area {
      flex-shrink: 0; display: none; justify-content: center;
      padding: 6px 0 2px;
    }
    .save-area.show { display: flex; }
    .save-pill {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 44px; border-radius: 40px;
      font-size: 18px; font-weight: 600;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      color: #E0E7FF; box-shadow: 0 0 20px rgba(99,102,241,0.2);
      transition: all 0.25s ease;
    }
    .save-pill:hover { transform: scale(1.05); box-shadow: 0 0 28px rgba(99,102,241,0.3); }
    .save-pill:active { transform: scale(0.94); }

    .hint-text { font-size: 14px; color: #555F72; text-align: center; }
    .reset-link {
      font-size: 14px; color: #555F72; padding: 3px 10px; border-radius: 6px; transition: all 0.2s;
    }
    .reset-link:hover { color: #EF4444; background: rgba(239,68,68,0.1); }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px); z-index: 100;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: #1E293B; border: 1px solid #334155; border-radius: 18px;
      padding: 24px 22px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;
    }
    .modal h2 { font-size: 21px; font-weight: 600; margin-bottom: 14px; color: #F1F5F9; }
    .modal label { display: block; font-size: 15px; font-weight: 500; color: #94A3B8; margin-bottom: 4px; margin-top: 14px; }
    .modal label:first-child { margin-top: 0; }
    .modal input {
      width: 100%; padding: 11px 14px; border-radius: 9px;
      border: 1px solid #334155; background: #0F172A;
      color: #E2E8F0; font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .modal input:focus { border-color: #818CF8; }
    .modal .hint { font-size: 13px; color: #555F72; margin-top: 3px; }
    .modal .btn-row { display: flex; gap: 10px; margin-top: 18px; }
    .modal .btn-row button {
      flex: 1; padding: 11px; border-radius: 9px; font-weight: 500; font-size: 15px; transition: all 0.2s;
    }
    .modal .btn-primary { background: #4F46E5; color: #F8FAFC; }
    .modal .btn-primary:hover { background: #6366F1; }
    .modal .btn-secondary { background: #334155; color: #CBD5E1; }
    .modal .btn-secondary:hover { background: #475569; }
    .welcome p { color: #94A3B8; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
    .welcome ul { color: #94A3B8; font-size: 15px; padding-left: 18px; line-height: 1.7; margin-bottom: 12px; }
    .welcome strong { color: #CBD5E1; }

    /* ===== Toast ===== */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #7F1D1D; color: #FCA5A5; padding: 12px 24px; border-radius: 12px;
      font-size: 15px; font-weight: 500; z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
      max-width: 90%; text-align: center;
    }
    .toast.show { opacity: 1; pointer-events: auto; }

    @media (max-width: 400px) {
      .app { padding: 12px 14px 0; }
      .avatar-container { width: 110px; height: 110px; }
      .avatar-circle { width: 98px; height: 98px; }
      .avatar-face { width: 68px; height: 68px; }
      .transcript { max-height: 140px; }
    }
    @media (min-height: 800px) {
      .avatar-container { width: 150px; height: 150px; }
      .avatar-circle { width: 132px; height: 132px; }
      .avatar-face { width: 92px; height: 92px; }
    }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <span class="header-title">✦ English Talker</span>
    <span class="model-badge" id="modelBadge"></span>
    <div class="header-actions">
      <button class="icon-btn" id="resetBtn" title="New topic">⟳</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <!-- ===== Centered: Avatar + Status + Button ===== -->
  <section class="avatar-section">
    <div class="avatar-container">
      <div class="avatar-ring idle" id="avatarRing"></div>
      <div class="avatar-circle idle" id="avatarCircle">
        <svg class="avatar-face" viewBox="0 0 120 120" fill="none">
          <circle cx="60" cy="60" r="58" fill="url(#bg)" opacity="0.3"/>
          <defs><radialGradient id="bg" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#4F46E5"/>
          </radialGradient></defs>
          <ellipse cx="60" cy="65" rx="38" ry="36" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
          <g class="eyes">
            <ellipse class="eye-open" cx="42" cy="60" rx="6" ry="7" fill="#E2E8F0"/>
            <ellipse class="eye-open" cx="42" cy="60" rx="3" ry="3.5" fill="#0F172A"/>
            <ellipse class="eye-open" cx="78" cy="60" rx="6" ry="7" fill="#E2E8F0"/>
            <ellipse class="eye-open" cx="78" cy="60" rx="3" ry="3.5" fill="#0F172A"/>
            <path class="eye-closed" d="M36 60 Q42 54 48 60" stroke="#E2E8F0" stroke-width="2.5" fill="none"/>
            <path class="eye-closed" d="M72 60 Q78 54 84 60" stroke="#E2E8F0" stroke-width="2.5" fill="none"/>
          </g>
          <ellipse cx="34" cy="72" rx="6" ry="3" fill="#818CF8" opacity="0.15"/>
          <ellipse cx="86" cy="72" rx="6" ry="3" fill="#818CF8" opacity="0.15"/>
          <path d="M48 78 Q60 88 72 78" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <circle cx="28" cy="46" r="2" fill="#A78BFA" opacity="0.4">
            <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="92" cy="44" r="1.8" fill="#A78BFA" opacity="0.3">
            <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
    </div>

    <div class="status-text idle" id="statusText">Press <strong>Start</strong> to begin</div>

    <div class="preview-box" id="previewBox"></div>

    <div class="respond-indicator" id="respondIndicator">
      <span class="pencil">✎</span>
      <span>Luna is responding</span>
      <span class="typing-dots" style="display:inline-flex;margin-left:2px"><span></span><span></span><span></span></span>
    </div>
    <div class="preparing-indicator" id="preparingIndicator">
      <span class="loader"></span>
      <span>Preparing microphone</span>
    </div>

    <button class="action-btn idle" id="actionBtn">
      <span id="btnIcon">▶</span>
      <span id="btnLabel">Start</span>
    </button>
  </section>

  <hr class="divider" />

  <!-- ===== Transcript ===== -->
  <div class="transcript" id="transcript"></div>

  <!-- ===== Save area ===== -->
  <div class="save-area" id="saveArea">
    <button class="save-pill" id="saveBtn">↓ Save conversation</button>
  </div>

  <!-- ===== Bottom ===== -->
  <div class="bottom-bar">
    <div class="hint-text" id="hintText">Press Start → speak → Luna replies</div>
    <button class="reset-link" id="resetConvBtn" style="display:none">↺ New topic</button>
  </div>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const CFG = {
  BASE:      'https://api.deepseek.com/v1',
  MODEL:     'deepseek-chat',
  MAX_TOK:   1024,
  MAX_HIST:  10,
  SILENCE:   2000,   // ms of silence before sending
};

// ===== STATE =====
const S = {
  mode:    'idle',
  apiKey:  localStorage.getItem('et_key_ds') || '',
  baseURL: localStorage.getItem('et_base') || CFG.BASE,
  model:   localStorage.getItem('et_model') || CFG.MODEL,
  inputLang: localStorage.getItem('et_lang') || 'en-US',  // en-US or zh-CN
  messages: [],
  recog:    null,
  synth:    null,
  voice:    null,
  speaking: false,
  active:   false,     // conversation running?
  silenceTimer: null,
  accum:    '',        // accumulated final text
  interim:  '',        // latest interim text
  stopping: false,     // internal flag to prevent restart loops
  abort:    null,
  turnLock: false,
};

// ===== DOM =====
const $ = id => document.getElementById(id);
const ring    = $('avatarRing');
const circle  = $('avatarCircle');
const status  = $('statusText');
const prev    = $('previewBox');
const btn     = $('actionBtn');
const icon    = $('btnIcon');
const label   = $('btnLabel');
const trans   = $('transcript');
const hint    = $('hintText');
const ind     = $('respondIndicator');
const saveArea = $('saveArea');
const saveBtn = $('saveBtn');
const modelBadge = $('modelBadge');
const overlay = $('modalOverlay');
const mBody   = $('modalContent');
const toast   = $('toast');

// ===== HELPERS =====
function msg(m, d = 3000) {
  toast.textContent = m; toast.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(() => toast.classList.remove('show'), d);
}
function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function scrollT() { requestAnimationFrame(() => { trans.scrollTop = trans.scrollHeight; }); }
function updateModelBadge() { modelBadge.textContent = S.model; }

function setMode(m) {
  S.mode = m;
  ring.className = 'avatar-ring ' + m;
  circle.className = 'avatar-circle ' + m;
  status.className = 'status-text ' + m;

  const txt = { idle:'Press <strong>Start</strong> to begin', preparing:'Preparing microphone', listening:'Listening', processing:'Thinking', speaking:'Speaking' };
  status.innerHTML = txt[m] || '';

  // Indicators
  ind.classList.toggle('show', m === 'processing');
  $('preparingIndicator').classList.toggle('show', m === 'preparing');

  // Button
  if (S.active) {
    btn.className = 'action-btn active'; icon.textContent = '■'; label.textContent = 'Stop';
  } else {
    btn.className = 'action-btn idle'; icon.textContent = '▶'; label.textContent = 'Start';
  }

  const ht = { idle:'Press Start → speak → Luna replies automatically', listening:"Listening — speak now",
    processing:'Waiting for Luna', speaking:'Luna is speaking — get ready' };
  hint.innerHTML = ht[m] || '';
}

// ===== SPEECH RECOGNITION =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function initRec() {
  if (S.recog) return true;
  if (!SR) { msg('Speech recognition needs Chrome or Edge.'); return false; }
  const r = new SR();
  r.lang = S.inputLang;
  r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;

  r.onstart = () => {
    // Recognition is actually ready — now user can speak
    setMode('listening');
  };

  r.onresult = (e) => {
    if (S.mode !== 'listening') return;
    let fin = '', intr = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) fin += e.results[i][0].transcript;
      else intr += e.results[i][0].transcript;
    }
    if (fin) {
      S.accum += (S.accum ? ' ' : '') + fin.trim();
      S.interim = '';  // Final result supersedes old interim — prevents text doubling
    }
    if (intr) S.interim = intr;

    const display = S.accum + (S.interim ? ' ' + S.interim : '');
    if (display.trim()) {
      prev.textContent = display;
      prev.classList.add('active');
    }
    // Reset silence timer whenever we have anything
    clearTimeout(S.silenceTimer);
    if (display.trim()) {
      S.silenceTimer = setTimeout(onSilence, CFG.SILENCE);
    }
  };

  r.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted' || e.error === 'not-allowed') {
      if (e.error === 'not-allowed') msg('Microphone blocked — allow mic access and try again.');
      return;
    }
    msg('Mic error: ' + e.error);
  };

  r.onend = () => {
    // Auto-restart with delay to prevent tight CPU loops
    if (S.active && S.mode === 'listening' && !S.stopping && !S.turnLock) {
      clearTimeout(S._retryTimer);
      S._retryTimer = setTimeout(() => {
        if (S.active && S.mode === 'listening' && !S.stopping) {
          try { S.recog.start(); } catch (e) {}
        }
      }, 500);
    }
  };

  S.recog = r;
  return true;
}

function listenStart() {
  if (!initRec()) return;
  if (!S.apiKey) { msg('Set your API key in settings first.'); openSettings(); return; }
  // Show preparing state until onstart fires
  setMode('preparing');
  try { S.recog.start(); } catch (e) { /* already started */ }
}

function listenStop() {
  clearTimeout(S.silenceTimer);
  clearTimeout(S._retryTimer);
  try { S.recog.stop(); } catch (e) {}
}

function onSilence() {
  if (S.mode !== 'listening' || !S.active) return;
  const text = prev.textContent.trim();
  if (!text) return;
  // Mark stopping so onend doesn't re-start
  S.stopping = true;
  listenStop();
  S.stopping = false;
  prev.classList.remove('active');
  prev.textContent = '';
  S.accum = ''; S.interim = '';
  sendAI(text);
}

// ===== TEXT-TO-SPEECH =====
function initTTS() {
  if (!window.speechSynthesis) return false;
  S.synth = window.speechSynthesis;
  const vs = S.synth.getVoices();
  S.voice = vs.find(v => v.lang.startsWith('en') && (v.name.includes('Google')||v.name.includes('Samantha')||v.name.includes('Microsoft')))
         || vs.find(v => v.lang.startsWith('en'))
         || vs[0];
  return true;
}

function speak(t) {
  if (!S.synth && !initTTS()) return;
  if (S.speaking) { try { S.synth.cancel(); } catch (e) {} }
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US'; u.rate = 0.90; u.pitch = 1.05;
  if (S.voice) u.voice = S.voice;
  u.onstart = () => { S.speaking = true; setMode('speaking'); };
  u.onend = u.onerror = () => {
    S.speaking = false;
    S.turnLock = false;
    if (S.active) setTimeout(() => { if (S.active) listenStart(); }, 400);
    else setMode('idle');
  };
  S.synth.speak(u);
}

// ===== DEEPSEEK API =====
async function sendAI(text) {
  if (S.turnLock) return;
  S.turnLock = true;
  setMode('processing');

  // User bubble
  addMsg('user', text);
  S.messages.push({ role: 'user', content: text });

  // Typing
  const typ = document.createElement('div');
  typ.className = 'msg assist';
  typ.innerHTML = `<div class="av">✦</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
  trans.appendChild(typ);
  scrollT();

  const system = `You are "Luna", a friendly conversation partner with broad general knowledge.

Rules:
- Detect the language of the user's message and reply in the same language.
- If the user asks for translation, do as requested.
- You can answer all kinds of questions — science, history, technology, daily life, anything.
- Keep responses under 200 characters (Chinese: 200字以内).
- Be warm and natural. Ask follow-up questions occasionally.
- Never correct the user's grammar explicitly. Just respond naturally.
- Never break character or say you are an AI.`;

  try {
    const ctrl = new AbortController();
    S.abort = ctrl;

    const resp = await fetch(S.baseURL + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + S.apiKey },
      body: JSON.stringify({
        model: S.model,
        max_tokens: CFG.MAX_TOK,
        stream: true,
        messages: [{ role: 'system', content: system }, ...S.messages.slice(-CFG.MAX_HIST * 2)],
      }),
      signal: ctrl.signal,
    });

    if (!resp.ok) {
      let e = 'API error ' + resp.status;
      try { const j = await resp.json(); e = j.error?.message || e; } catch (x) {}
      if (resp.status === 401) e = 'Invalid API key. Check settings.';
      if (resp.status === 402) e = 'Insufficient balance. Top up your DeepSeek account.';
      throw new Error(e);
    }

    if (typ.parentNode) typ.remove();

    const div = document.createElement('div');
    div.className = 'msg assist';
    const bub = document.createElement('div');
    bub.className = 'bub stream';
    div.innerHTML = '<div class="av">✦</div>';
    div.appendChild(bub);
    trans.appendChild(div);
    scrollT();

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let full = '', buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t || t === 'data: [DONE]') continue;
        if (!t.startsWith('data: ')) continue;
        try {
          const p = JSON.parse(t.slice(6));
          const c = p.choices?.[0]?.delta?.content || '';
          if (c) { full += c; bub.textContent = full; scrollT(); }
        } catch (e) {}
      }
    }

    if (!full.trim()) throw new Error('Empty response from API');
    bub.classList.remove('stream');
    S.messages.push({ role: 'assistant', content: full });
    speak(full);

  } catch (err) {
    if (err.name === 'AbortError') { S.turnLock = false; return; }
    console.error(err);
    if (typ.parentNode) typ.remove();
    msg(err.message);
    S.turnLock = false;
    if (S.active) setTimeout(() => { if (S.active) listenStart(); }, 600);
    else setMode('idle');
  }
}

// ===== SHOW/HIDE after stop =====
function showAfterStop() {
  const hasMsgs = S.messages.length > 0 && !S.active;
  saveArea.classList.toggle('show', hasMsgs);
  $('resetConvBtn').style.display = hasMsgs ? 'block' : 'none';
}

// ===== EXPORT =====
function exportConversation() {
  if (S.messages.length === 0) return;
  const date = new Date();
  const pad = n => String(n).padStart(2, '0');
  const ts = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;

  let text = '✦ English Talker — Conversation Summary\n';
  text +=  '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
  text += `  Date: ${ts}\n`;
  text += `  Messages: ${S.messages.length / 2} rounds\n`;
  text +=  '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n';

  for (const m of S.messages) {
    if (m.role === 'system') continue;
    const speaker = m.role === 'user' ? '🧑 You' : '✦ Luna';
    text += `${speaker}: ${m.content}\n\n`;
  }

  text += '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
  text += '  Generated by English Talker\n';

  // Download
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `english-conversation-${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  msg('Conversation saved!');
}

// ===== UI =====
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'assist');
  d.innerHTML = `<div class="av">${role === 'user' ? '🧑' : '✦'}</div><div class="bub">${esc(text)}</div>`;
  trans.appendChild(d);
  scrollT();
  showAfterStop();
}

function startConv() {
  if (S.active) return;
  if (!S.apiKey) { msg('Set your API key in settings first.'); openSettings(); return; }
  S.active = true; S.turnLock = false; S.accum = ''; S.interim = ''; prev.textContent = '';
  listenStart();
}

function stopConv() {
  S.active = false; S.turnLock = false;
  clearTimeout(S.silenceTimer); clearTimeout(S._retryTimer);
  S.stopping = true;
  listenStop();
  S.stopping = false;
  if (S.speaking) { try { S.synth.cancel(); } catch (e) {} S.speaking = false; }
  if (S.abort) { try { S.abort.abort(); } catch (e) {} S.abort = null; }
  S.accum = ''; S.interim = ''; prev.textContent = ''; prev.classList.remove('active');
  showAfterStop();
  setMode('idle');
}

function resetConv() {
  if (S.active) stopConv();
  S.messages = []; trans.innerHTML = ''; prev.textContent = ''; prev.classList.remove('active');
  S.accum = ''; S.interim = ''; saveArea.classList.remove('show');
  $('resetConvBtn').style.display = 'none';
  setMode('idle');
}

// ===== SETTINGS =====
function openSettings(first = false) {
  mBody.innerHTML = `
    ${first ? `<div class="welcome">
      <h2>👋 Welcome!</h2>
      <p>Practice English conversation with <strong>Luna</strong>.</p>
      <ul>
        <li>Press <strong>Start</strong> — speak English naturally</li>
        <li>Luna replies automatically after a short pause</li>
        <li>Press <strong>Stop</strong> to end</li>
      </ul>
      <p>Enter your <strong>DeepSeek API key</strong>.</p>
    </div>` : '<h2>⚙️ Settings</h2>'}
    <label>DeepSeek API Key</label>
    <input type="password" id="iKey" value="${S.apiKey}" placeholder="sk-..." />
    <div class="hint">Stored locally.</div>
    <label>API Base URL</label>
    <input type="text" id="iBase" value="${S.baseURL}" placeholder="${CFG.BASE}" />
    <label>Model</label>
    <input type="text" id="iModel" value="${S.model}" placeholder="${CFG.MODEL}" />
    <div class="hint">Default: ${CFG.MODEL}</div>
    <label>Input Language</label>
    <select id="iLang" style="width:100%;padding:11px 14px;border-radius:9px;border:1px solid #334155;background:#0F172A;color:#E2E8F0;font-size:15px;outline:none;">
      <option value="en-US" ${S.inputLang === 'en-US' ? 'selected' : ''}>English</option>
      <option value="zh-CN" ${S.inputLang === 'zh-CN' ? 'selected' : ''}>中文 (Chinese)</option>
    </select>
    <div class="hint">Speak in this language — Luna responds in English</div>
    <div class="btn-row">
      <button class="btn-primary" id="mSave">${first ? 'Start →' : 'Save'}</button>
      ${first ? '' : '<button class="btn-secondary" id="mCancel">Cancel</button>'}
    </div>`;
  overlay.classList.add('open');

  $('mSave').onclick = () => {
    S.apiKey = ($('iKey').value || '').trim();
    S.baseURL = ($('iBase').value || '').trim().replace(/\/+$/, '') || CFG.BASE;
    S.model = ($('iModel').value || '').trim() || CFG.MODEL;
    const newLang = $('iLang').value;
    if (newLang !== S.inputLang) { S.recog = null; }  // force re-init on lang change
    S.inputLang = newLang;
    localStorage.setItem('et_key_ds', S.apiKey);
    if (S.baseURL !== CFG.BASE) localStorage.setItem('et_base', S.baseURL);
    else localStorage.removeItem('et_base');
    if (S.model !== CFG.MODEL) localStorage.setItem('et_model', S.model);
    else localStorage.removeItem('et_model');
    localStorage.setItem('et_lang', newLang);
    updateModelBadge();
    overlay.classList.remove('open');
    if (S.apiKey) msg('Saved!');
  };
  const c = $('mCancel'); if (c) c.onclick = () => overlay.classList.remove('open');
  setTimeout(() => { const e = $('iKey'); if (e) e.focus(); }, 100);
}

// ===== EVENTS =====
btn.onclick = () => S.active ? stopConv() : startConv();
$('settingsBtn').onclick = () => openSettings(false);
$('resetBtn').onclick = resetConv;
saveBtn.onclick = exportConversation;
$('resetConvBtn').onclick = resetConv;
overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('open'); };
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); btn.click(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.active && S.mode === 'listening') {
    const t = prev.textContent.trim();
    if (t) { S.stopping = true; listenStop(); S.stopping = false; prev.textContent = ''; S.accum = ''; S.interim = ''; sendAI(t); }
  }
});

// ===== INIT =====
(function init() {
  // Clean stale localStorage values matching current defaults
  if (localStorage.getItem('et_base') === CFG.BASE) localStorage.removeItem('et_base');
  if (localStorage.getItem('et_model') === CFG.MODEL) localStorage.removeItem('et_model');
  S.baseURL = localStorage.getItem('et_base') || CFG.BASE;
  S.model = localStorage.getItem('et_model') || CFG.MODEL;
  updateModelBadge();

  if (window.speechSynthesis) {
    initTTS();
    if (speechSynthesis.onvoiceschanged !== undefined)
      speechSynthesis.onvoiceschanged = () => initTTS();
  }
  if (!S.apiKey) setTimeout(() => openSettings(true), 400);
})();
</script>
